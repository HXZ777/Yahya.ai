
name: Build Yahya AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Extract project
        run: |
          set -e
          test -f project.zip
          mkdir -p source

          echo "=== PROJECT FILES ==="
          unzip -Z1 project.zip | head -200

          unzip -q project.zip -d source

          ROOT=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "::error::Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

          echo "=== PROJECT ROOT ==="
          ls -la "$ROOT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "=== BUILDING YAHYA AI ==="
          gradle --no-daemon assembleDebug --stacktrace

      - name: Find APK
        run: |
          set -e

          echo "=== SEARCHING FOR APK ==="
          find source -type f -name '*.apk'

          APK=$(find source -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK file not found"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Yahya-AI-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
