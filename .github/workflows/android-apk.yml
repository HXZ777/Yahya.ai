
name: Build Yahya AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract and inspect project
        run: |
          set -e
          test -f project.zip
          mkdir -p source
          echo "=== ZIP CONTENTS ==="
          unzip -Z1 project.zip | head -200
          unzip -q project.zip -d source

          WRAPPER=$(find source -type f -name gradlew -print -quit)

          if [ -n "$WRAPPER" ]; then
            echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"
            echo "BUILD_MODE=wrapper" >> "$GITHUB_ENV"
          else
            ROOT=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
            if [ -z "$ROOT" ]; then
              echo "::error::Gradle project not found"
              exit 1
            fi
            echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
            echo "BUILD_MODE=system" >> "$GITHUB_ENV"
          fi

      - name: Setup Gradle
        if: env.BUILD_MODE == 'system'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ "$BUILD_MODE" = "wrapper" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Yahya-AI-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
